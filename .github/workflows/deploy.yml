name: Build (CI only — no deploy)

# Deployment to MonsterASP is MANUAL:
#   1. Run publish.bat locally  → C:\Users\Public\Documents\part-rfq-pro\publish_clean
#   2. Zip the publish_clean CONTENTS manually (web.config at zip root)
#   3. Upload the zip via FTP / control panel
#   4. Unzip into the site root, restart the website
# This workflow only verifies the project builds and the publish output is valid.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish web application (verification build)
        run: >-
          dotnet publish src/ThreeDAnalyzer.Web/ThreeDAnalyzer.Web.csproj
          -c Release
          -o "${{ github.workspace }}/publish"
          --self-contained false
          /p:UseAppHost=false

      - name: Verify publish output
        shell: pwsh
        run: |
          $pub = "${{ github.workspace }}\publish"
          @(
            "web.config",
            "ThreeDAnalyzer.Web.dll",
            "ThreeDAnalyzer.Web.deps.json",
            "ThreeDAnalyzer.Web.runtimeconfig.json",
            "Data\material-specs-master.json",
            "Data\machines-master.json",
            "wwwroot\js\viewer.js",
            "wwwroot\lib\three.module.min.js",
            "wwwroot\lib\occt-import-js.wasm"
          ) | ForEach-Object {
            if (-not (Test-Path (Join-Path $pub $_))) { throw "Missing required file: $_" }
            Write-Host "OK: $_"
          }
          if (Test-Path (Join-Path $pub "ThreeDAnalyzer.Web.exe")) {
            throw "FAIL: ThreeDAnalyzer.Web.exe found in publish output. MonsterASP requires DLL-only. Check UseAppHost=false."
          }
          Write-Host "Publish output is valid. Deploy manually with publish.bat + FTP."
